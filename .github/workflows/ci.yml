name: Node.JS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: application-build
          path: dist/

  docker-build:
    needs:
      - build
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/danielnalle/learn-github-actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show docker version
        run: docker --version

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: |
          docker build \
          -t "$IMAGE_NAME:${{ github.sha }}" \
          .

      - name: List all docker images
        run: docker image ls

      - name: Push docker image
        if: ${{ github.event_name == 'push' }}
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"

  deploy-staging:
    runs-on: ubuntu-latest
    needs:
      - docker-build
    environment: staging
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Test SSH Connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "echo 'SSH connection successful'"

      - name: SSH to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST"

      - name: Set working directory
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -e
          cd $DEPLOY_PATH

      - name: Update docker image tag
        run: sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}'

      - name: Pull image
        run: docker compose pull

      - name: Activate container
        run: docker compose up -d

      - name: Verify container is running
        run: docker compose ps

      - name: Verify health check
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi

            sleep 2
          done

          exit 1
