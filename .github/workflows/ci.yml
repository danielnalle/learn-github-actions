name: Node.JS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: application-build
          path: dist/

  docker-build:
    needs:
      - build
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/danielnalle/learn-github-actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show docker version
        run: docker --version

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: |
          docker build \
          -t "$IMAGE_NAME:${{ github.sha }}" \
          .

      - name: List all docker images
        run: docker image ls

      - name: Push docker image
        if: ${{ github.event_name == 'push' }}
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
